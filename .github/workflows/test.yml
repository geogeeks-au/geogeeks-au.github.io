name: Build the Geogeeks website, to test that PRs work

on:
  pull_request

jobs:

  test:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore Commons Gallery cache
        uses: actions/cache/restore@v4
        with:
          path: _data/commons_cache
          key: commons-cache-${{ runner.os }}-${{ hashFiles('_plugins/commons_gallery.rb') }}
          restore-keys: |
            commons-cache-${{ runner.os }}-

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: development
